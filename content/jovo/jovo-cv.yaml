    listitems:
    - date: 2019 – 2022
      position: Mentor
      institution: Black in AI
    - date: 2017 –
      position: Scientific Advisory Board
      institution: NSF NeuroNex
      desc: Enhanced resolution for 3DEM analysis of synapses across brain regions and taxa. Provided
        scientific, computational, and statistical guidance to a flagship NSF funded BRAIN Initiative
        program
    - date: 2017 –
      position: Chair of Committee of Data Cores
      institution: U19 Data Cores
      desc: The U19 program is NIH's flagship BRAIN Initative program, with five original awardees, each
        with a dedicated Data Core and designated PI. I was elected the chair of the committee of Data
        Core PIs
    - date: '2017'
      position: Consultant for Nature Publishing Group
      desc: The journal Nature, flagship journal of Nature Publishing Group, decided to create a "Code
        and Software Submission Checklist". They consulted me on their first draft, and I helped re-write
        it. An image of the final checklist is available <a href="https://github.com/jovo/cv/raw/master/Code-and-Software-Submission-Checklist.png">here</a>
    - date: 2011 –
      position: Open Connectome Project
      desc: The co-founder of the "Open Connectome Project" (OCP), for several years, I was the only neuroscientist
        that could easily store, manage, and analyze very big datasets, spanning first tens of terabytes,
        and then hundreds. For that reason, I was an essential co-author on a number of big data papers.
        Specifically, though I sometimes contributed relatively little to the scientific ideas, I often
        was required to complete, visualize, and/or share the data. Perhaps more importantly, both funding
        agencies and journals began mandating that these large datasets be publicly shared, and OCP was
        literally the only option. This is despite often not having funding, nor being a co-author, on
        the manuscripts
    - date: 2010 –
      position: AWS Open Neuro Data Registry
      desc: Our lab co-founded the <a href="https://registry.opendata.aws/open-neurodata/">Registry of
        Open Data on Amazon Web Serivces</a> (AWS). The implication of this is that now, pending a few
        minor considerations, any neuroscientist that collects large image data can deposit it online
        <em>for free</em>. This means that neither they nor we must request funding to store the data.
        Our lab maintains this repository, but only by virtue of ensuring instructions for uploading,
        visualizing, and downloading are up to date, and acting as a gatekeeper to ensure only appropriate
        data are deposited there
