  transfer:
  - title: Open Datasets
    listitems:
    - date: 2019 –
      url: https://neurodata.io/data/templier2019
      title: Templier et al. (2019)
      stats: 34 citations, 119 unique visitors
      desc: The non-destructive collection of ultrathin sections onto silicon wafers for post-embedding
        staining and volumetric correlative light and electron microscopy using MagC. MagC allows the
        correlative visualization of neuroanatomical tracers within their ultrastructural volumetric electron
        microscopy context
    - date: 2018 –
      url: https://neurodata.io/data/bloss2018
      title: Bloss et al. (2018)
      stats: 149 citations, 530 unique visitors
      desc: Images of CA1 pyramidal neurons for analysis involving feature-selective firing as a result
        of dendritic integration of inputs from multiple brain regions. Show that single presynaptic axons
        form multiple, spatially clustered inputs onto the distal, but not proximal, dendrites of CA1
        pyramidal neurons
    - date: 2018 –
      url: https://neurodata.io/data/branch18
      title: Branch (2018)
      stats: 2 citations, 223 unique visitors
      desc: Adult generated neurons in aging M. musculus imaged using array tomography, multi-spectral
        light microscopy, and electron microscopy
    - date: 2017 –
      url: https://neurodata.io/data/allen_atlas
      title: Allen Atlas
      stats: 142 citations, 1058 unique visitors
      desc: Anatomical reference atlases that illustrate the adult mouse brain in coronal and sagittal
        planes. They are the spatial framework for datasets such as in situ hybridization, cell projection
        maps, and in vitro cell characterization.<a href="http://atlas.brain-map.org/">atlas.brain-map.org</a>
    - date: 2017 –
      url: https://neurodata.io/data/hildebrand17
      title: Hildebrand et al. (2017)
      stats: 416 citations, 1,014 unique visitors
      desc: A multi-resolution serial-section electron microscopy data set containing the anterior quarter
        of a 5.5 days post fertilization larval zebrafish, including its complete brain acquired by Hildebrand
        and colleagues. Electron micrographs and reconstructions are available for view in CATMAID
    - date: 2017 –
      url: https://neurodata.io/data/tobin17
      title: Tobin et al. (2017)
      stats: 150 citations, 43 unique visitors
      desc: Wiring variations that enable and constrain neural computation in a sensory microcircuit
    - date: 2016 –
