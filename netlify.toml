[build]
  command = "grow install && GROW_THREADS=1 grow build && cp robots-demo.txt build/robots.txt"
  publish = "build"

[build.environment]
  PYTHON_VERSION = "3.8"
  NETLIFY_BUILD_IMAGE = "focal"

[context.deploy-preview]
  command = "grow install && GROW_THREADS=1 grow build && cp robots-demo.txt build/robots.txt"