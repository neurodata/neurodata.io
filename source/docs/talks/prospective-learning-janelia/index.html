<h1 id="is-time-important">Is time important?</h1>
<h2 id="for-data-driven-ai-for-neuroscience">for Data-Driven AI for Neuroscience</h2>
<ul>
<li data-marpit-fragment="1">If you care about doing better later, then you  care about <em><strong>time</strong></em></li>
<li data-marpit-fragment="2">If you care about doing better later, then you  care about *<strong>learning</strong></li>
<li data-marpit-fragment="3">Time <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.057ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.247ex" role="img" focusable="false" viewBox="0 -526 1000 551"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D4" d="M308 524Q318 526 323 526Q340 526 340 514Q340 507 336 499Q326 476 314 454T292 417T274 391T260 374L255 368Q255 367 500 367Q744 367 744 368L739 374Q734 379 726 390T707 416T685 453T663 499Q658 511 658 515Q658 525 680 525Q687 524 690 523T695 519T701 507Q766 359 902 287Q921 276 939 269T961 259T966 250Q966 246 965 244T960 240T949 236T930 228T902 213Q763 137 701 -7Q697 -16 695 -19T690 -23T680 -25Q658 -25 658 -15Q658 -11 663 1Q673 24 685 46T707 83T725 109T739 126L744 132Q744 133 500 133Q255 133 255 132L260 126Q265 121 273 110T292 84T314 47T336 1Q341 -11 341 -15Q341 -25 319 -25Q312 -24 309 -23T304 -19T298 -7Q233 141 97 213Q83 221 70 227T51 235T41 239T35 243T34 250T35 256T40 261T51 265T70 273T97 287Q235 363 299 509Q305 522 308 524ZM792 319L783 327H216Q183 294 120 256L110 250L120 244Q173 212 207 181L216 173H783L792 181Q826 212 879 244L889 250L879 256Q826 288 792 319Z"></path></g></g></g></svg></mjx-container> Learning</li>
<li data-marpit-fragment="4">Alas, classical (supervised) ML/AI does not take time seriously</li>
</ul>

<h1 id="predictable-switches-change-both-loss-measures">Predictable switches change both loss measures</h1>
<p><img src="assets/generated-figures/scenario2-fig2-left.svg" alt="Left: Task A labels inputs in [-2,-1] as -1 and [1,2] as +1, Task B flips the labels. Right: the task switches every 20 samples. Instantaneous risk of Follow-the-leader, Online SGD and Bayesian GD spikes at each switch and stays near chance, while prospective ERM drops to zero. Prospective risk of the baselines stays at chance 0.5 while prospective ERM falls to Bayes risk 0 by about step 700." /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-theme="base" lang="en-US" style="--theme:base;">
<h1 id="prospective-erm-approaches-bayes-risk">Prospective ERM approaches Bayes risk</h1>
<p><img src="../prospective-learning-astera/assets/generated-figures/four-task-schedule-draft.svg" alt="Four task distributions A through D repeat, each lasting ten observations, for MNIST and CIFAR-10." /></p>
<p><img src="../prospective-learning-astera/assets/generated-figures/scenario2-benchmarks.svg" alt="Scenario 2 MNIST and CIFAR-10 prospective risk from archived raw metric arrays" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="base" lang="en-US" style="--theme:base;">
<h1 id="prospective-learning-works-with-infinitely-many-aperiodic-tasks">Prospective learning works with infinitely many aperiodic tasks</h1>
<p><img src="assets/generated-figures/linear-process-task-and-risk.svg" alt="Two input classes drift up together over time. On that process, prospective risk falls to the Bayes risk for a monomial time representation, and stays near chance for a Fourier representation and for follow-the-leader." /></p>
<blockquote>
<p>The time representation should encode the future structure of the process</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="base" lang="en-US" style="--theme:base;">
<h1 id="prospective-erm-learns-the-adaptive-transition-law">Prospective ERM learns the adaptive transition law</h1>
<div class="cols">
<figure><img src="../prospective-learning-astera/assets/generated-figures/scenario3-transition.svg?v=4" alt="A four-state hierarchical Markov process: alternating transition dynamics select between paired state dynamics every ten observations." /></figure>
<figure><img src="../prospective-learning-astera/assets/generated-figures/scenario3-risk-all-baselines.svg?v=7" alt="Scenario 3 prospective risk. Curves: Follow-the-Leader, Prospective ERM, Online-SGD, Bayesian GD, Bayes risk, and chance." /></figure>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="base" lang="en-US" style="--theme:base;">
<h1 id="prospective-foraging">Prospective foraging</h1>
<p><img src="../prospective-learning-astera/assets/generated-figures/prospective-foraging.svg?v=3" alt="Prospective foraging environment with alternating, decaying reward patches" /></p>
<blockquote>
<p>Alternating reward patches decay before arrival</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-theme="base" lang="en-US" style="--theme:base;">
<h1 id="pluc-is-efficient-in-adaptive-foraging">PLuC is efficient in adaptive foraging</h1>
<p><img src="../prospective-learning-astera/assets/generated-figures/prospective-control-regret.svg?v=4" alt="Prospective regret rate from archived PLuC, SAC, and PPO runs. Lines show medians and shaded bands show interquartile ranges." /></p>
<blockquote>
<p>100× faster than time-aware SAC/PPO, neither converges without time</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-theme="base" lang="en-US" style="--theme:base;">
