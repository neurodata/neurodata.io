version: 0.2

phases:
  install:
    commands:
      - echo Installing grow
      - pip install grow==1.0.4 pyyaml==5.3.1 bibtexparser==1.2.0 jinja2==2.11.3
      - apt-get update
      - apt-get install yarn
      - yarn install
      - cd cv/cv_new && npm install && npx playwright install --with-deps chromium && cd ../..
  build:
    commands:
      - export LC_ALL=C.UTF-8
      # regenerate the downloadable CV PDF from content/bibs/ + content/bibs/tex,
      # so it always matches whatever's on the site -- must run before `grow
      # build` packages source/images/people/jovo_cv_SOM.pdf as a static file
      - cd cv/cv_new
      - python3 build_cv.py
      - python3 assemble.py
      - node render.js
      - cd ../..
      - cp cv/cv_new/jovo_cv.pdf source/images/people/jovo_cv_SOM.pdf
      # 3/10/2023 dependency conflict resolution
      - pip install markupsafe==2.0.1
      - grow install
      - grow build --deployment default
      - mkdir build/bib_files
  post_build:
    commands:
      - aws s3 sync --delete --cache-control "max-age=10800" build/ "s3://nd-website-deploy"
      - aws s3 cp robots-prod.txt "s3://nd-website-deploy"
      - aws configure set preview.cloudfront true
      - aws cloudfront create-invalidation --distribution-id E1XLAJR2ZIAY9Y --paths '/*'
